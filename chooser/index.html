<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-07 Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#14171c; --muted:#5d6675; --line:#e2e5ea;
    --ok:#15935b; --down:#c2410c;
    --shadow:0 1px 3px rgba(20,24,29,.06),0 12px 32px rgba(20,24,29,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    -webkit-font-smoothing:antialiased}

  .chooser{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;
    padding:clamp(20px,4vh,48px) clamp(16px,5vw,72px);gap:clamp(18px,3vh,36px)}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{font-size:clamp(28px,4vw,48px);font-weight:800;letter-spacing:-.03em;margin:0}
  header p{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,1.4vw,18px)}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(18px,2vw,28px);color:var(--muted)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));
    gap:clamp(16px,2.5vw,36px);align-content:center}
  .card{--accent:#2563eb;position:relative;background:var(--panel);border:2px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    text-align:left;padding:0;font:inherit;color:inherit}
  .card:hover{transform:translateY(-3px)}
  .card.sel{border-color:var(--accent);transform:translateY(-4px);
    box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
  .card:focus-visible{outline:none}
  .card.down .prev .ph{filter:grayscale(1);opacity:.5}

  .prev{position:relative;aspect-ratio:16/9;background:#0b0d11;overflow:hidden}
  .prev .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,8vw,110px);
    background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 35%,#0b0d11),#0b0d11 70%)}
  .num{position:absolute;top:16px;left:16px;width:54px;height:54px;border-radius:15px;background:var(--accent);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:27px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .status{position:absolute;top:18px;right:16px;display:flex;align-items:center;gap:8px;padding:7px 13px;
    border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.94);color:var(--muted)}
  .status i{width:9px;height:9px;border-radius:50%;background:currentColor}
  .status.up{color:var(--ok)} .status.down{color:var(--down)}

  .body{padding:clamp(18px,2.2vw,28px);display:grid;gap:8px;flex:1}
  .name{font-size:clamp(24px,2.6vw,34px);font-weight:800;letter-spacing:-.02em}
  .tag{font-size:clamp(14px,1.3vw,17px);font-weight:700;color:var(--accent)}
  .desc{color:var(--muted);font-size:clamp(14px,1.2vw,16px);line-height:1.5}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .meta span{font-size:13px;color:var(--muted);background:#f1f3f6;border-radius:8px;padding:5px 9px}
  .meta b{color:var(--ink);font-weight:700}
  .go{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .go .btn{display:inline-flex;align-items:center;gap:10px;background:#eef0f3;color:var(--ink);
    font-weight:700;font-size:16px;padding:12px 20px;border-radius:12px;transition:background .18s,color .18s}
  .card.sel .go .btn{background:var(--accent);color:#fff}
  .go .port{font:600 13px ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted)}

  footer{display:flex;justify-content:center;gap:22px;color:var(--muted);font-size:14px;flex-wrap:wrap}
  kbd{font:600 12px ui-monospace,"SF Mono",Menlo,monospace;background:#fff;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--ink)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,160%);background:var(--ink);color:#fff;
    padding:13px 20px;border-radius:12px;font-weight:600;font-size:15px;box-shadow:var(--shadow);
    transition:transform .3s cubic-bezier(.2,.9,.2,1.1);max-width:calc(100vw - 32px);text-align:center;z-index:30}
  .toast:not(.show){visibility:hidden;transition:transform .3s,visibility 0s .3s}
  .toast.show{transform:translate(-50%,0)}

  /* the chosen app, full-screen */
  .shell{position:fixed;inset:0;background:#000;display:none;z-index:10}
  .shell.on{display:block}
  .shell iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .back{position:fixed;left:14px;bottom:14px;z-index:20;display:none;align-items:center;gap:8px;
    padding:10px 16px;border-radius:999px;border:0;background:rgba(20,23,28,.75);color:#fff;
    font:700 14px Inter,system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(6px);opacity:.6;transition:opacity .2s}
  .back:hover,.back:focus-visible{opacity:1}
  .shell.on ~ .back{display:inline-flex}

  @media(prefers-reduced-motion:reduce){.card,.toast{transition:none}}
</style>
</head>
<body>
<main class="chooser" id="chooser">
  <header>
    <div>
      <h1>Choose an app</h1>
      <p>pi-07 &middot; IR camera &middot; powered by TypeSafe Jev</p>
    </div>
    <div class="clock" id="clock"></div>
  </header>
  <section class="cards" id="cards" aria-label="Apps"></section>
  <footer>
    <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> choose</span>
    <span><kbd>Enter</kbd> open</span>
    <span><kbd>1</kbd> <kbd>2</kbd> open directly</span>
  </footer>
</main>

<div class="shell" id="shell"><iframe id="frame" title="App" allow="autoplay; fullscreen; geolocation"></iframe></div>
<button class="back" id="back" aria-label="Back to the app chooser">&#8962; Apps</button>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
let apps = [], sel = 0, status = {}, openId = null;
try{ sel = parseInt(localStorage.getItem("chooser_sel")) || 0; }catch(e){}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const appUrl = a => `${location.protocol}//${location.hostname}:${a.port}/`;

function render(){
  $("#cards").innerHTML = apps.map((a, i) => `
    <button class="card" id="card-${a.id}" data-i="${i}" style="--accent:${a.accent}" aria-label="Open ${esc(a.name)}">
      <div class="prev">
        <div class="ph">${a.icon || ""}</div>
        <span class="num">${i + 1}</span>
        <span class="status" id="st-${a.id}"><i></i><span>checking&hellip;</span></span>
      </div>
      <div class="body">
        <div class="name">${esc(a.name)}</div>
        <div class="tag">${esc(a.tagline)}</div>
        <div class="desc">${esc(a.description)}</div>
        <div class="meta" id="meta-${a.id}"></div>
        <div class="go"><span class="btn">Open App ${i + 1} &rarr;</span><span class="port">:${a.port}</span></div>
      </div>
    </button>`).join("");
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => launch(+c.dataset.i));
    c.addEventListener("mouseenter", () => select(+c.dataset.i));
  });
  select(Math.min(sel, apps.length - 1));
}

function select(i){
  sel = (i + apps.length) % apps.length;
  try{ localStorage.setItem("chooser_sel", sel); }catch(e){}
  document.querySelectorAll(".card").forEach((c, k) => c.classList.toggle("sel", k === sel));
}

async function refresh(){
  try{
    const list = await (await fetch("/api/status", {cache: "no-store"})).json();
    for(const s of list){
      status[s.id] = s;
      const a = apps.find(x => x.id === s.id); if(!a) continue;
      const st = $("#st-" + s.id), card = $("#card-" + s.id);
      st.className = "status " + (s.up ? "up" : "down");
      st.querySelector("span").textContent = s.up ? "Running" : "Offline";
      card.classList.toggle("down", !s.up);
      $("#meta-" + s.id).innerHTML = s.up ? "" : "<span>starts automatically &mdash; give it a moment</span>";
    }
  }catch(e){}
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3500);
}

function launch(i, fromHistory){
  const a = apps[i]; if(!a) return;
  select(i);
  if(status[a.id] && !status[a.id].up){
    toast(`${a.name} isn't running yet. It starts automatically, so try again in a moment.`);
    return;
  }
  openId = a.id;
  $("#frame").src = appUrl(a);
  $("#shell").classList.add("on");
  document.title = `${a.name} · pi-07`;
  if(!fromHistory) history.pushState({app: a.id}, "", "#" + a.id);
  $("#frame").focus();
}

function closeApp(fromHistory){
  if(!openId) return;
  openId = null;
  $("#shell").classList.remove("on");
  $("#frame").src = "about:blank";          // stops the app's video stream
  document.title = "pi-07 Apps";
  if(!fromHistory && location.hash) history.pushState({}, "", location.pathname);
  refresh();
}

$("#back").addEventListener("click", () => closeApp());
window.addEventListener("popstate", () => {
  const i = apps.findIndex(a => "#" + a.id === location.hash);
  if(i >= 0) launch(i, true); else closeApp(true);
});
document.addEventListener("keydown", e => {
  if(openId){ if(e.key === "Escape") closeApp(); return; }
  if(["ArrowRight", "ArrowDown"].includes(e.key)){ select(sel + 1); e.preventDefault(); }
  else if(["ArrowLeft", "ArrowUp"].includes(e.key)){ select(sel - 1); e.preventDefault(); }
  else if(e.key === "Enter" || e.key === " "){ launch(sel); e.preventDefault(); }
  else if(/^[1-9]$/.test(e.key) && +e.key <= apps.length){ launch(+e.key - 1); }
});

function tick(){
  $("#clock").textContent = new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}

(async function init(){
  tick(); setInterval(tick, 10000);
  apps = await (await fetch("/api/apps")).json();
  render();
  await refresh();
  setInterval(() => { if(!openId) refresh(); }, 10000);   // just Running / Offline
  const i = apps.findIndex(a => "#" + a.id === location.hash);
  if(i >= 0) launch(i, true);
})();
</script>
</body>
</html>
